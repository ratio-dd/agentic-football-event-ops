name: Bootstrap GitHub-hosted feedback deployment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "One-time migration action"
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - audit
          - retire

permissions:
  contents: read

jobs:
  bootstrap:
    name: Install restricted deployment key
    runs-on: [self-hosted, linux, feedback]
    timeout-minutes: 10
    environment: feedback
    env:
      DEPLOY_PATH: /home/ubuntu/agentic-football-event-ops
      DEPLOY_PUBLIC_KEY: ${{ vars.FEEDBACK_DEPLOY_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate the one-time deployment public key
        if: inputs.mode == 'bootstrap'
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_PUBLIC_KEY" ] || { echo "Missing repository variable FEEDBACK_DEPLOY_PUBLIC_KEY." >&2; exit 2; }
          printf '%s\n' "$DEPLOY_PUBLIC_KEY" | ssh-keygen -lf - >/dev/null
      - name: Install the forced-command deployment endpoint
        if: inputs.mode == 'bootstrap'
        run: |
          set -euo pipefail
          install -m 700 lightsail/deploy-from-github.sh "$DEPLOY_PATH/lightsail/deploy-from-github.sh"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          temporary_file="$(mktemp)"
          awk '
            $0 == "# agentic-football-github-hosted-deployer" { skip = 1; next }
            skip == 1 { skip = 0; next }
            { print }
          ' "$HOME/.ssh/authorized_keys" > "$temporary_file"
          {
            echo '# agentic-football-github-hosted-deployer'
            printf '%s %s\n' \
              'no-port-forwarding,no-agent-forwarding,no-X11-forwarding,no-pty,no-user-rc,command="/home/ubuntu/agentic-football-event-ops/lightsail/deploy-from-github.sh"' \
              "$DEPLOY_PUBLIC_KEY"
          } >> "$temporary_file"
          install -m 600 "$temporary_file" "$HOME/.ssh/authorized_keys"
          rm -f "$temporary_file"
      - name: Audit legacy self-hosted runner (read-only)
        if: inputs.mode == 'audit'
        run: |
          set -euo pipefail
          echo "Runner user: $(id -un)"
          echo "Runner service scripts:"
          find "$HOME" -maxdepth 3 -type f -name svc.sh -print
          echo "Runner systemd units:"
          systemctl list-unit-files --type=service 'actions.runner*' --no-legend || true
          systemctl list-units --all --type=service 'actions.runner*' --no-legend || true
      - name: Schedule legacy runner retirement
        if: inputs.mode == 'retire'
        run: |
          set -euo pipefail
          readonly runner_service='actions.runner.ratio-dd-agentic-football-event-ops.agentic-football-feedback.service'
          sudo systemd-run \
            --unit=agentic-football-retire-runner \
            --on-active=1min \
            --collect \
            /usr/bin/systemctl disable --now "$runner_service"
          echo "Scheduled $runner_service to stop after this job has completed."
