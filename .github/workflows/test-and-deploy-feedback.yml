name: Test and deploy feedback

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: feedback-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Configure isolated Worker bindings for E2E
        run: |
          cat > .dev.vars <<'EOF'
          STAFF_PINS=[{"id":"e2e-staff","pin":"meetup-staff","enabled":true}]
          ADMIN_PIN=meetup-admin
          EOF
      - run: npm test
      - name: Build immutable Lightsail image on the hosted runner
        run: |
          npm run lightsail:build
          image="agentic-football-event-ops:feedback-${GITHUB_SHA}"
          docker build -t "$image" -f lightsail/Dockerfile .
          docker save --output /tmp/lightsail-image.tar "$image"
      - name: Upload validated Lightsail image
        uses: actions/upload-artifact@v4
        with:
          name: lightsail-image
          path: /tmp/lightsail-image.tar
          if-no-files-found: error
          retention-days: 1

  deploy-feedback:
    name: Deploy feedback to Lightsail
    needs: test
    if: github.ref == 'refs/heads/main' && vars.FEEDBACK_HOSTED_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: feedback-production-deploy
      cancel-in-progress: false
    environment: feedback
    env:
      DEPLOY_HOST: ${{ vars.FEEDBACK_LIGHTSAIL_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.FEEDBACK_LIGHTSAIL_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Download validated Lightsail image
        uses: actions/download-artifact@v4
        with:
          name: lightsail-image
          path: deploy-artifacts
      - name: Assemble restricted deployment archive
        run: |
          set -euo pipefail
          mkdir -p release
          cp deploy-artifacts/lightsail-image.tar release/lightsail-image.tar
          printf 'CANDIDATE_IMAGE=agentic-football-event-ops:feedback-%s\n' "$GITHUB_SHA" > release/manifest.env
          tar -C release -czf deploy-artifacts/feedback-release.tar.gz .
      - name: Configure restricted SSH client
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_HOST" ] || { echo "Missing repository variable FEEDBACK_LIGHTSAIL_HOST." >&2; exit 2; }
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "Missing repository variable FEEDBACK_LIGHTSAIL_KNOWN_HOSTS." >&2; exit 2; }
          [ -n "${{ secrets.FEEDBACK_DEPLOY_SSH_PRIVATE_KEY }}" ] || { echo "Missing repository secret FEEDBACK_DEPLOY_SSH_PRIVATE_KEY." >&2; exit 2; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.FEEDBACK_DEPLOY_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/feedback_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/feedback_deploy" "$HOME/.ssh/known_hosts"
      - name: Stream candidate to Lightsail and verify public health
        run: |
          set -euo pipefail
          cat deploy-artifacts/feedback-release.tar.gz | ssh \
            -i "$HOME/.ssh/feedback_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "ubuntu@$DEPLOY_HOST"
          curl --fail --silent --show-error --connect-timeout 8 --max-time 15 \
            "https://$DEPLOY_HOST/healthz"
