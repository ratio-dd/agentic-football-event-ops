name: Test and deploy feedback

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feedback-deploy-main
  cancel-in-progress: true

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Configure isolated Worker bindings for E2E
        run: |
          cat > .dev.vars <<'EOF'
          STAFF_PINS=[{"id":"e2e-staff","pin":"meetup-staff","enabled":true}]
          ADMIN_PIN=meetup-admin
          EOF
      - run: npm test
      - name: Build immutable Lightsail image on the hosted runner
        run: |
          npm run lightsail:build
          image="agentic-football-event-ops:feedback-${GITHUB_SHA}"
          docker build -t "$image" -f lightsail/Dockerfile .
          docker save --output /tmp/lightsail-image.tar "$image"
      - name: Upload validated Lightsail image
        uses: actions/upload-artifact@v4
        with:
          name: lightsail-image
          path: /tmp/lightsail-image.tar
          if-no-files-found: error
          retention-days: 1

  deploy-feedback:
    name: Deploy feedback to Lightsail
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, feedback]
    timeout-minutes: 20
    environment: feedback
    env:
      DEPLOY_PATH: /home/ubuntu/agentic-football-event-ops
    steps:
      - uses: actions/checkout@v4
      - name: Download validated Lightsail image
        uses: actions/download-artifact@v4
        with:
          name: lightsail-image
          path: deploy-artifacts
      - name: Upload validated source
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.env' \
            --exclude '.dev.vars*' \
            --exclude '.local-data/' \
            --exclude 'lightsail/.aws/' \
            --exclude 'lightsail/.tls/' \
            --exclude 'lightsail/.acme/' \
            --exclude 'lightsail/runtime/' \
            --exclude 'deploy-artifacts/' \
            ./ "$DEPLOY_PATH/"
      - name: Load candidate, verify health, and roll back on failure
        run: |
          set -euo pipefail
          cd /home/ubuntu/agentic-football-event-ops
          compose=(sudo docker compose -p agentic-football-feedback -f lightsail/docker-compose.feedback-ip.yml)
          previous_image="$(sudo docker inspect --format '{{.Config.Image}}' agentic-football-feedback 2>/dev/null || true)"
          candidate_image="agentic-football-event-ops:feedback-${GITHUB_SHA}"

          rollback() {
            echo "Candidate deployment failed; preserving diagnostics and restoring the previous app image."
            sudo docker logs --tail 150 agentic-football-feedback || true
            if [ -n "$previous_image" ]; then
              sudo env APP_IMAGE="$previous_image" docker compose -p agentic-football-feedback -f lightsail/docker-compose.feedback-ip.yml up -d --no-deps --force-recreate app || true
            fi
          }
          trap rollback ERR

          sudo docker load --input "$GITHUB_WORKSPACE/deploy-artifacts/lightsail-image.tar"
          sudo docker image inspect "$candidate_image" >/dev/null
          sudo env APP_IMAGE="$candidate_image" docker compose -p agentic-football-feedback -f lightsail/docker-compose.feedback-ip.yml up -d --no-deps --force-recreate app

          for attempt in $(seq 1 12); do
            health="$(sudo docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' agentic-football-feedback)"
            if [ "$health" = healthy ]; then
              break
            fi
            echo "Waiting for app health ($attempt/12): $health"
            sleep 5
          done

          [ "$(sudo docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' agentic-football-feedback)" = healthy ]
          curl --fail --silent --show-error --connect-timeout 5 --max-time 10 --insecure https://127.0.0.1/healthz
          "${compose[@]}" ps
          sudo docker tag "$candidate_image" agentic-football-event-ops:feedback
