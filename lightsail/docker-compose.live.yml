services:
  app:
    build:
      context: ..
      dockerfile: lightsail/Dockerfile
    env_file: ${CONFIG_ENV_FILE:-.env}
    volumes:
      - live-event-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    env_file: ${CONFIG_ENV_FILE:-.env}
    volumes:
      - ./Caddyfile.live:/etc/caddy/Caddyfile:ro
      - live-caddy-data:/data
      - live-caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

volumes:
  live-event-data:
  live-caddy-data:
  live-caddy-config:
