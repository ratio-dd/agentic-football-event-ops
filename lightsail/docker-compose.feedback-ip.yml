services:
  app:
    image: ${APP_IMAGE:-agentic-football-event-ops:feedback}
    container_name: agentic-football-feedback
    env_file: ${CONFIG_ENV_FILE:-.env}
    volumes:
      - feedback-event-data:/data
    networks:
      - feedback-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 10s

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: agentic-football-feedback-proxy
    depends_on:
      app:
        condition: service_healthy
    env_file: ${CONFIG_ENV_FILE:-.env}
    volumes:
      - ./Caddyfile.feedback-ip:/etc/caddy/Caddyfile:ro
      - ./.tls:/etc/caddy/tls:ro
      - ./.acme:/srv/acme:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - feedback-caddy-data:/data
      - feedback-caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    networks:
      - feedback-network
    restart: unless-stopped

networks:
  feedback-network:
    name: agentic-football-feedback-network

volumes:
  feedback-event-data:
    external: true
    name: agentic-football-feedback-data
  feedback-caddy-data:
  feedback-caddy-config:
